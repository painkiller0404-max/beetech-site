<!doctype html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="utf-8">
  <script>document.documentElement.classList.add("js")</script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BEE TECHNOLOGY</title>
  <meta name="description" content="BEE TECHNOLOGY – IT services and systems integration in Oran, Algeria.">
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
  <div class="container nav">
    <a href="#top" class="brand" aria-label="BEE TECHNOLOGY">
      <img class="logo" src="logo.png" alt="BEE TECHNOLOGY" width="64" height="53">
    </a>
    <nav class="menu" id="menu">
      <a href="#services" data-i18n="nav_services"></a>
      <a href="#about" data-i18n="nav_about"></a>
      <a href="#why" data-i18n="nav_why"></a>
      <a href="#contact" data-i18n="nav_contact"></a>
    </nav>
    <div class="lang" role="group" aria-label="Language">
      <button data-lang="fr">FR</button>
      <button data-lang="en">EN</button>
      <button data-lang="ar">عربية</button>
    </div>
    <button class="burger" id="burger" aria-label="Menu" aria-expanded="false"><span></span><span></span><span></span></button>
  </div>
</header>

<main id="top">

  <section class="hero">
    <div class="container hero-inner">
      <p class="eyebrow" data-i18n="hero_eyebrow"></p>
      <h1 data-i18n="hero_title"></h1>
      <p class="lead" data-i18n="hero_sub"></p>
      <div class="cta">
        <a class="btn btn-primary" href="#contact" data-i18n="hero_cta1"></a>
        <a class="btn btn-ghost" href="#services" data-i18n="hero_cta2"></a>
      </div>
    </div>
  </section>

  <section id="services" class="section">
    <div class="container">
      <h2 class="reveal" data-i18n="services_title"></h2>
      <p class="section-sub reveal" data-i18n="services_sub"></p>
      <div class="grid">
        <article class="card reveal">
          <div class="icon"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="6" rx="1.5"/><rect x="3" y="14" width="18" height="6" rx="1.5"/><path d="M7 7h.01M7 17h.01"/></svg></div>
          <h3 data-i18n="s1_t"></h3><p data-i18n="s1_d"></p>
        </article>
        <article class="card reveal">
          <div class="icon"><svg viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/></svg></div>
          <h3 data-i18n="s2_t"></h3><p data-i18n="s2_d"></p>
        </article>
        <article class="card reveal">
          <div class="icon"><svg viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg></div>
          <h3 data-i18n="s3_t"></h3><p data-i18n="s3_d"></p>
        </article>
        <article class="card reveal">
          <div class="icon"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg></div>
          <h3 data-i18n="s4_t"></h3><p data-i18n="s4_d"></p>
        </article>
        <article class="card reveal">
          <div class="icon"><svg viewBox="0 0 24 24"><path d="M8 8l-4 4 4 4M16 8l4 4-4 4M14 5l-4 14"/></svg></div>
          <h3 data-i18n="s5_t"></h3><p data-i18n="s5_d"></p>
        </article>
        <article class="card reveal">
          <div class="icon"><svg viewBox="0 0 24 24"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.4 2.4-2.6-.6-.6-2.6z"/></svg></div>
          <h3 data-i18n="s6_t"></h3><p data-i18n="s6_d"></p>
        </article>
      </div>
    </div>
  </section>

  <section id="about" class="section alt">
    <div class="container about">
      <div class="reveal reveal-start">
        <h2 data-i18n="about_title"></h2>
        <p data-i18n="about_p1"></p>
        <p data-i18n="about_p2"></p>
      </div>
      <ul class="stats">
        <li class="reveal reveal-end"><strong>IT / SI</strong><span data-i18n="stat1"></span></li>
        <li class="reveal reveal-end"><strong>Oran</strong><span data-i18n="stat2"></span></li>
        <li class="reveal reveal-end"><strong>24/7</strong><span data-i18n="stat3"></span></li>
      </ul>
    </div>
  </section>

  <section id="why" class="section">
    <div class="container">
      <h2 class="reveal" data-i18n="why_title"></h2>
      <div class="grid four">
        <div class="why reveal"><span class="num">01</span><h3 data-i18n="w1_t"></h3><p data-i18n="w1_d"></p></div>
        <div class="why reveal"><span class="num">02</span><h3 data-i18n="w2_t"></h3><p data-i18n="w2_d"></p></div>
        <div class="why reveal"><span class="num">03</span><h3 data-i18n="w3_t"></h3><p data-i18n="w3_d"></p></div>
        <div class="why reveal"><span class="num">04</span><h3 data-i18n="w4_t"></h3><p data-i18n="w4_d"></p></div>
      </div>
    </div>
  </section>

  <section id="contact" class="section contact">
    <div class="container contact-inner">
      <h2 class="reveal" data-i18n="contact_title"></h2>
      <p class="section-sub reveal" data-i18n="contact_sub"></p>
      <div class="reveal">
      <a class="btn btn-wa" id="wa-btn" href="#" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 3.5A11 11 0 0 0 3.2 17.3L2 22l4.8-1.2A11 11 0 0 0 22 12a10.9 10.9 0 0 0-1.5-8.5zM12 20a8.9 8.9 0 0 1-4.5-1.2l-.3-.2-2.8.7.8-2.7-.2-.3A8.9 8.9 0 1 1 12 20zm4.9-6.7c-.3-.1-1.6-.8-1.8-.9s-.4-.1-.6.1-.7.9-.9 1.1-.3.2-.6.1a7.3 7.3 0 0 1-3.6-3.1c-.3-.4.3-.4.8-1.4a.5.5 0 0 0 0-.5l-.8-1.9c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.8 11.9 11.9 0 0 0 4.6 4.1c1.7.7 2.4.8 3.2.7a2.7 2.7 0 0 0 1.8-1.3 2.2 2.2 0 0 0 .2-1.3c-.1-.1-.3-.2-.6-.3z"/></svg>
        <span data-i18n="wa_cta"></span>
      </a>
      </div>
      <ul class="details reveal">
        <li><span data-i18n="c_email"></span><a id="c-email" href="#"></a></li>
        <li><span data-i18n="c_phone"></span><a id="c-phone" href="#" dir="ltr"></a></li>
        <li><span data-i18n="c_addr"></span><b data-i18n="c_addr_v"></b></li>
      </ul>
    </div>
  </section>

</main>

<footer class="footer">
  <div class="container">
    <span>© <span id="year"></span> BEE TECHNOLOGY</span>
    <span data-i18n="footer_tag"></span>
  </div>
</footer>

<script src="script.js"></script>
<script src="animations.js"></script>
</body>
</html>
